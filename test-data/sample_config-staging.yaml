instance:
  name: hoprd-operator
  namespace: hoprd-operator
gateway:
  gateway_name: hoprd-operator
  gateway_namespace: hoprd-operator
  dns_domain: staging.hoprnet.link
  loadbalancer_ip: 34.159.20.69
  port_min: 9000
  port_max: 10000
  certificate_issuer:
    name: gcp-issuer
    kind: ClusterIssuer
otlp:
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
  signals: metrics
  metric_export_interval: "15000"
hopli_image: europe-west3-docker.pkg.dev/hoprassociation/docker-images/hopli:0.20.1
kubectl_image: docker.io/alpine/k8s:1.36.5
hopli_rpc_provider_url: https://rpc-provider.hoprnet.org
persistence:
  size: 4Gi
  storage_class_name: standard-rwo
webhook:
  crt_file: test-data/tls.crt
  key_file: test-data/tls.key