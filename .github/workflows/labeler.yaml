---
name: Labeler
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access: the labeler only reads the
      # config from the base branch and the changed file names, it never checks
      # out or executes code from the pull request.
      - uses: actions/labeler@bc32c493030cc908233048429a1f81da3057fbbc # main on 22.01.2026
        with:
          sync-labels: true
