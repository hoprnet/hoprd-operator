---
################################################################################
# Pull request pipeline for the hoprd-crds Helm chart
#
# Lints, packages and scans the chart and regenerates its parameters README. The
# chart is also published with the commit short hash as version when the pull
# request has the publish-helm-charts label.
################################################################################
name: 'PR Helm chart CRDs'
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
    branches:
      - master
    paths:
      - "charts/hoprd-crds/**"
concurrency:
  group: pr-helm-hoprd-crds-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  helm-chart:
    name: Helm Chart
    uses: ./.github/workflows/helm-chart.yaml
    permissions:
      contents: write # zizmor: ignore[excessive-permissions]
      id-token: write # zizmor: ignore[excessive-permissions]
    with:
      chart_name: hoprd-crds
      publish: ${{ contains(github.event.pull_request.labels.*.name, 'publish-helm-charts') }}
