---
################################################################################
# Merge pipeline for the hoprd-crds Helm chart
#
# Runs when a pull request touching the chart is merged into master and publishes
# the chart with the pull request version (<Chart.yaml version>-pr.<number>).
# Releases are cut with release.yaml.
################################################################################
name: 'Merge Helm chart CRDs'
on:
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - "charts/hoprd-crds/**"
concurrency:
  group: merge-helm-hoprd-crds
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  helm-chart:
    name: Helm Chart
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/helm-chart.yaml
    permissions:
      contents: write # zizmor: ignore[excessive-permissions]
      id-token: write # zizmor: ignore[excessive-permissions]
    with:
      chart_name: hoprd-crds
      publish: true
