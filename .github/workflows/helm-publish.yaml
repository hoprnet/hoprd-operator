---
################################################################################
# Reusable workflow that packages and publishes one Helm chart
#
# The pull request number and the commit to check out come from the caller's
# github context (the merged pull request, or the commit a release is run on).
# Called by the merge-helm-* workflows (pull request versions) and by
# release.yaml (release versions, which also push the git tag).
################################################################################
name: 'Publish Helm chart'
on:
  workflow_call:
    inputs:
      chart_name:
        description: "Chart directory under charts/ and chart name (cluster-hoprd, hoprd-crds, hoprd-operator)"
        required: true
        type: string
      version_type:
        description: "pr (pull request merged) publishes <version>-pr.<pull request number>; release publishes <version> and pushes the git tag"
        required: true
        type: string
    secrets:
      github_app_private_key:
        description: "GitHub App private key used to push the release tag (release only)"
        required: false
permissions:
  contents: read
jobs:
  publish:
    name: Publish
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "${VERSION_TYPE}" in
            pr) [ -n "${PR_NUMBER}" ] || { echo "::error::pr_number is required for version_type pr"; exit 1; } ;;
            release) ;;
            *) echo "::error::Unknown version_type ${VERSION_TYPE}"; exit 1 ;;
          esac
      - name: Generate short-lived github token from GitHub App Hoprnet
        id: bot-token
        if: inputs.version_type == 'release'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_HOPRNET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.github_app_private_key }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.bot-token.outputs.token || github.token }}
          persist-credentials: ${{ inputs.version_type == 'release' }}
      - name: Get Helm chart version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHART_NAME: ${{ inputs.chart_name }}
        run: |
          tag_prefix="helm-${CHART_NAME}"
          chart_version=$(grep '^version:' Chart.yaml | sed 's/.*: //')
          if [ "${VERSION_TYPE}" = "pr" ]; then
            echo "HELM_CHART_VERSION=${chart_version}-pr.${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse "refs/tags/${tag_prefix}-${chart_version}" >/dev/null 2>&1; then
              echo "::error::${tag_prefix} ${chart_version} is already released. Bump the chart version first."
              exit 1
            fi
            echo "HELM_CHART_VERSION=${chart_version}" >> "$GITHUB_OUTPUT"
          fi
        working-directory: charts/${{ inputs.chart_name }}
      - name: Setup GCP
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@ac3e0b6137b0ba470a30c373aab2ceba9e0879e4 # setup-gcp-v4
        with:
          login_artifact_registry: 'true'
      - name: Helm Package
        env:
          HELM_CHART_VERSION: ${{ steps.version.outputs.HELM_CHART_VERSION }}
        run: helm package . --version "${HELM_CHART_VERSION}"
        working-directory: charts/${{ inputs.chart_name }}
      - name: Helm Publish
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          HELM_CHART_VERSION: ${{ steps.version.outputs.HELM_CHART_VERSION }}
        run: helm push "${CHART_NAME}-${HELM_CHART_VERSION}.tgz" oci://europe-west3-docker.pkg.dev/hoprassociation/helm-charts
        working-directory: charts/${{ inputs.chart_name }}
      - name: Tag Helm version
        if: inputs.version_type == 'release'
        env:
          TAG: helm-${{ inputs.chart_name }}-${{ steps.version.outputs.HELM_CHART_VERSION }}
        run: |
          git config user.email "noreply@hoprnet.org"
          git config user.name "HOPR CI robot"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
