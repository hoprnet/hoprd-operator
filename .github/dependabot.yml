---

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # k8s-openapi 0.28 drops the v1_34 feature and is not compatible with
      # kube 2.0.1. Re-enable this when kube is upgraded.
      - dependency-name: "k8s-openapi"
        update-types:
          - "version-update:semver-minor"
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      cargo-major:
        patterns:
          - "*"
        update-types:
          - "major"
