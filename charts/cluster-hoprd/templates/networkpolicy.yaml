{{- /* The ingress of every node (API and p2p port) is managed by the operator in a NetworkPolicy owned by each Hoprd, with the exact port it allocates */ -}}
{{- if .Values.clusterHoprd.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-hoprd.name" . }}-allow-egress
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: node
      hoprds.hoprnet.org/cluster: {{ include "cluster-hoprd.name" . }}
  policyTypes:
    - Egress
  egress:
    # The nodes of the same Hopr network reach each other. DNS and the Internet are allowed by the global policies of the cluster
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: node
              hoprds.hoprnet.org/network: {{ .Values.clusterHoprd.network }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.clusterHoprd.networkPolicy.egressBlokli.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.clusterHoprd.networkPolicy.egressBlokli.port }}
    # The OTLP collector the nodes push their telemetry to (hoprdOperator.otlp.endpoint)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.clusterHoprd.networkPolicy.egressOtlp.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.clusterHoprd.networkPolicy.egressOtlp.port }}
{{- end }}
