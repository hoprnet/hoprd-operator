{{- if .Values.clusterHoprd.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-hoprd.name" . }}-allow-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: node
      hoprds.hoprnet.org/cluster: {{ include "cluster-hoprd.name" . }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.clusterHoprd.networkPolicy.ingressNginx.namespace }}
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: node
              hoprds.hoprnet.org/network: {{ .Values.clusterHoprd.network }}
      ports:
        - protocol: TCP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
        - protocol: UDP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
    {{- if eq .Values.clusterHoprd.nodes.service.type "LoadBalancer" }}
    # ICMP "port unreachable" replies from unreachable p2p peers get dropped here (no ICMP
    # value in NetworkPolicy - only fix is removing ports: below, which opens all ports from
    # 0.0.0.0/0). Left as-is: the peer is unreachable either way, this is expected p2p churn,
    # and the port-exposure cost isn't worth it for at-best marginally faster peer timeout.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
        - protocol: UDP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-hoprd.name" . }}-allow-egress
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: node
      hoprds.hoprnet.org/cluster: {{ include "cluster-hoprd.name" . }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: node
              hoprds.hoprnet.org/network: {{ .Values.clusterHoprd.network }}
      ports:
        - protocol: TCP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
        - protocol: UDP
          port: 9090
          endPort: {{ max 9090 (add 9089 .Values.clusterHoprd.nodes.service.portsAllocation) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.clusterHoprd.networkPolicy.egressBlokli.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.clusterHoprd.networkPolicy.egressBlokli.port }}
{{- end }}
