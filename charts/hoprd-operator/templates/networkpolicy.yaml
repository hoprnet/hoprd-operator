{{- if .Values.hoprdOperator.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hoprd-operator.fullname" . }}-webhook-allow-konnectivity-agent
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: {{ include "hoprd-operator.name" . }}
      app.kubernetes.io/name: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.hoprdOperator.networkPolicy.ingressKonnectivityAgent.namespace }}
          podSelector:
            matchLabels:
              {{- .Values.hoprdOperator.networkPolicy.ingressKonnectivityAgent.podSelector | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: webhook
{{- end }}
