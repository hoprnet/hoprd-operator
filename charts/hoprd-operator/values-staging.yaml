hoprdOperator:
  persistence:
    size: 4Gi
    storageClassName: regional-pd
  image:
    tag: latest
  hopli:
    tag: 0.20.1
  extraEnvVars: 
    - name: RUST_BACKTRACE
      value: full
    - name: RUST_LOG
      value: "hoprd_operator=DEBUG"
  gateway:
    dnsDomain: staging.hoprnet.link
    loadBalancerIP: 34.159.20.69
    certificateIssuer:
      name: gcp-issuer
      kind: ClusterIssuer
  webhook:
    enabled: false
