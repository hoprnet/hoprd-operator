operator:
  persistence:
    storageClassName: standard-rwo
  fastSync:
    enabled: true
    bucketName: logs-snapshots.hoprnet.org
    namespaces:
      - ctdapp
    crossplane:
      provider:
        crossplane: gcp-crossplane
        upbound: gcp-upbound
      gcpProjectId: hopr-prod
  image:
    tag: latest
    pullPolicy: Always
  extraEnvVars: 
    - name: RUST_BACKTRACE
      value: full
    - name: RUST_LOG
      value: "hoprd_operator=DEBUG"
  gateway:
    dnsDomain: prod.hoprnet.link
    loadBalancerIP: 35.242.216.67
    certificateIssuer:
      name: gcp-issuer
      kind: ClusterIssuer
