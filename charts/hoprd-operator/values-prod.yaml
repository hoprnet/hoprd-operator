operator:
  persistence:
    storageClassName: standard-rwo
  image:
    tag: latest
    pullPolicy: Always
  extraEnvVars: 
    - name: RUST_BACKTRACE
      value: full
    - name: RUST_LOG
      value: "hoprd_operator=DEBUG"
  networkPolicy:
    envoyGateway:
      namespace: envoy
  gateway:
    dnsDomain: prod.hoprnet.link
    loadBalancerIP: 35.242.216.67
    certificateIssuer:
      name: gcp-issuer
      kind: ClusterIssuer
