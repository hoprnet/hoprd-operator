hoprdOperator:

## @section Hopr Operator Parameters
##

  hopli:
    ## @param hoprdOperator.hopli.registry Docker registry to hopli image
    ##
    registry: europe-west3-docker.pkg.dev

    ## @param hoprdOperator.hopli.repository Docker image to hopli binary
    ##
    repository: hoprassociation/docker-images/hopli

    ## @param hoprdOperator.hopli.tag Docker image tag to hopli image
    ##
    tag: 0.20.1

    ## @param hoprdOperator.hopli.rpcProviderUrl RPC provider URL to be used by hopli binary
    ##
    rpcProviderUrl: ""

  kubectl:
    ## @param hoprdOperator.kubectl.registry Docker registry to the kubectl image
    ##
    registry: docker.io

    ## @param hoprdOperator.kubectl.repository Docker image with kubectl and bash, used by the jobs that talk to the Kubernetes API
    ##
    repository: alpine/k8s

    ## @param hoprdOperator.kubectl.tag Docker image tag of the kubectl image
    ##
    tag: 1.36.5

  ## @param hoprdOperator.defaultHoprdEnvVars Environment variables to be set in the Hoprd Nodes
  ##
  defaultHoprdEnvVars: {}
  # HOPRD_PROVIDER: http://localhost:8080/apiKey

  ## @param hoprdOperator.resources Resource specification to operator deployment
  ##
  resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

  ## @param hoprdOperator.extraEnvVars Array of extra environment variables
  ##
  extraEnvVars: []
  # extraEnvVars:
  #   - name: RUST_BACKTRACE
  #     value: full
  #   - name: RUST_LOG
  #     value: "hoprd_operator=INFO"

  ## @param hoprdOperator.extraLabels Extra labels added to the controller Deployment's own metadata
  ## (not the pod template) - e.g. for NetworkPolicy generator selectors.
  ##
  extraLabels: {}
  # extraLabels:
  #   network-policy.hoprnet.org/allow-kube-apiserver: "enabled"

  image:
    ## @param hoprdOperator.image.registry Docker registry to operator deployment
    ##
    registry: europe-west3-docker.pkg.dev

    ## @param hoprdOperator.image.repository Docker image repository to operator deployment
    ##
    repository: hoprassociation/docker-images/hoprd-operator

    ## @param hoprdOperator.image.tag Docker image tag to operator deployment
    ##
    tag: ""

    ## @param hoprdOperator.image.pullPolicy Pull policy to operator deployment as defined in 
    ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##
    pullPolicy: Always

  gateway:
    ## @param hoprdOperator.gateway.dnsDomain Name of the DNS suffix domain to be added to Hoprd nodes
    ##
    dnsDomain: ""

    ## @param hoprdOperator.gateway.loadBalancerIP Public IP of the LoadBalancer Service of the Gateway (Envoy proxy). It is also the host IP advertised by the Hoprd nodes
    ##
    loadBalancerIP: ""

    ports:
      ## @param hoprdOperator.gateway.ports.min Starting port to open on the Gateway
      ##
      min: 9000

      ## @param hoprdOperator.gateway.ports.max End port to open on the Gateway
      ##
      max: 10000

    certificateIssuer:
      ## @param hoprdOperator.gateway.certificateIssuer.name Name of the cert-manager issuer used to create the TLS certificate of each Hoprd node
      ##
      name: ""

      ## @param hoprdOperator.gateway.certificateIssuer.kind Kind of the cert-manager issuer (ClusterIssuer or Issuer)
      ##
      kind: ClusterIssuer

    ## @param hoprdOperator.gateway.controllerName Controller name of the GatewayClass. Use a different value per operator instance when several instances share a cluster
    ##
    controllerName: gateway.envoyproxy.io/gatewayclass-controller

    builtin:
      ## @param hoprdOperator.gateway.builtin.enabled Create the built-in EnvoyProxy, GatewayClass and Gateway used by the Hoprd nodes
      ##
      enabled: true

  otlp:
    ## @param hoprdOperator.otlp.endpoint OTLP endpoint where Hoprd nodes send their telemetry. When empty, telemetry is disabled. An http(s):// URL uses OTLP/HTTP (port 4318), any other value uses gRPC (port 4317)
    ##
    endpoint: ""

    ## @param hoprdOperator.otlp.signals Comma separated list of signals to export (traces,logs,metrics). Empty uses the Hoprd default
    ##
    signals: ""

    ## @param hoprdOperator.otlp.metricExportInterval Metric export interval in milliseconds, e.g. 15000 or 15000,hopr_session=1000. Empty uses the Hoprd default
    ##
    metricExportInterval: ""

  persistence:
    ## @param hoprdOperator.persistence.size Size of the persistence Volume
    ##
    size: 500Mi
    ## @param hoprdOperator.persistence.storageClassName Name of the storage class
    ##
    storageClassName: ""

  webhook:

    ## @param hoprdOperator.webhook.enabled Whether to enable the webhook server
    ##
    enabled: true
    tls:
      ## @param hoprdOperator.webhook.tls.crt TLS certificate for the webhook server
      ##
      crt: ""
      ## @param hoprdOperator.webhook.tls.key TLS private key for the webhook server
      ##
      key: ""

  networkPolicy:
    ## @param hoprdOperator.networkPolicy.enabled Whether to create a NetworkPolicy allowing
    ## ingress to the webhook server from konnectivity-agent (private cluster - the apiserver
    ## reaches webhooks by proxying through it rather than a direct apiserver IP)
    ##
    enabled: true
    envoyGateway:
      ## @param hoprdOperator.networkPolicy.envoyGateway.namespace Namespace where the Envoy Gateway controller runs. The proxy of the built-in Gateway reaches its xDS server from this namespace
      ##
      namespace: envoy
      podSelector:
        ## @param hoprdOperator.networkPolicy.envoyGateway.podSelector.control-plane Label identifying the Envoy Gateway controller pods
        ##
        control-plane: envoy-gateway
      ## @param hoprdOperator.networkPolicy.envoyGateway.xdsPort Port of the xDS server of the Envoy Gateway controller
      ##
      xdsPort: 18000
    proxy:
      ## @param hoprdOperator.networkPolicy.proxy.httpPort Container port of the HTTP listener of the proxy (Envoy Gateway adds 10000 to the privileged port 80)
      ##
      httpPort: 10080
      ## @param hoprdOperator.networkPolicy.proxy.httpsPort Container port of the HTTPS listener of the proxy (Envoy Gateway adds 10000 to the privileged port 443)
      ##
      httpsPort: 10443
    ingressKonnectivityAgent:
      ## @param hoprdOperator.networkPolicy.ingressKonnectivityAgent.namespace Namespace where the konnectivity-agent runs
      ##
      namespace: kube-system
      podSelector:
        ## @param hoprdOperator.networkPolicy.ingressKonnectivityAgent.podSelector.k8s-app Label identifying the konnectivity-agent pods
        ##
        k8s-app: konnectivity-agent
