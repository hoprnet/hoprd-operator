# Spike: can Envoy Gateway (>= 1.9) attach TCPRoute/UDPRoute to a ListenerSet and expose
# its TCP+UDP ports (same number) on the Envoy LoadBalancer Service?
#
# Run ONLY on a throwaway cluster (never prod). Not applied by anyone yet.
#
#   1. helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.10.0 \
#        -n envoy-gateway-system --create-namespace      # chart ships Gateway API CRDs v1.6.1
#      kubectl get crd listenersets.gateway.networking.k8s.io tcproutes.gateway.networking.k8s.io \
#        udproutes.gateway.networking.k8s.io                   # must exist and serve v1
#   2. kubectl apply -f spike/listenerset-spike.yaml
#   3. Checks (see end of file)
---
apiVersion: v1
kind: Namespace
metadata: { name: spike-node1 }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: { name: hoprd-proxy, namespace: envoy-gateway-system }
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment: { replicas: 1 }
      envoyService: { type: LoadBalancer }     # add loadBalancerIP to test the static IP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: hoprd }
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: hoprd-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: hoprd-gw, namespace: envoy-gateway-system }
spec:
  gatewayClassName: hoprd
  allowedListeners:
    namespaces: { from: All }
  listeners:
    # Envoy Gateway needs at least one listener on the Gateway itself.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: All } }
---
# Backend: one pod answering on TCP 9000 and UDP 9000 (echo)
apiVersion: apps/v1
kind: Deployment
metadata: { name: node-1, namespace: spike-node1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: node-1 } }
  template:
    metadata: { labels: { app: node-1 } }
    spec:
      containers:
        - name: tcp
          image: alpine/socat:1.8.0.1
          args: ["TCP-LISTEN:9000,fork,reuseaddr", "EXEC:cat"]
          ports: [{ containerPort: 9000, protocol: TCP }]
        - name: udp
          image: alpine/socat:1.8.0.1
          args: ["UDP-LISTEN:9000,fork,reuseaddr", "EXEC:cat"]
          ports: [{ containerPort: 9000, protocol: UDP }]
---
apiVersion: v1
kind: Service
metadata: { name: node-1, namespace: spike-node1 }
spec:
  selector: { app: node-1 }
  ports:
    - { name: p2p-tcp, port: 9000, protocol: TCP, targetPort: 9000 }
    - { name: p2p-udp, port: 9000, protocol: UDP, targetPort: 9000 }
---
# What the operator would create per Hoprd (owned by the Hoprd)
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata: { name: node-1, namespace: spike-node1 }
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: hoprd-gw
    namespace: envoy-gateway-system
  listeners:
    - { name: tcp-9000, protocol: TCP, port: 9000 }
    - { name: udp-9000, protocol: UDP, port: 9000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata: { name: node-1-tcp-9000, namespace: spike-node1 }
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: ListenerSet, name: node-1, sectionName: tcp-9000 }
  rules:
    - backendRefs: [{ name: node-1, port: 9000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata: { name: node-1-udp-9000, namespace: spike-node1 }
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: ListenerSet, name: node-1, sectionName: udp-9000 }
  rules:
    - backendRefs: [{ name: node-1, port: 9000 }]
---
# Checks
#  a) kubectl get gateway hoprd-gw -n envoy-gateway-system -o yaml
#       -> status.attachedListenerSets: 1, Programmed: True
#  b) kubectl get listenerset node-1 -n spike-node1 -o yaml
#       -> both listeners Accepted/Programmed; no Conflicted
#  c) kubectl get tcproute,udproute -n spike-node1 -o yaml
#       -> parent status Accepted: True, ResolvedRefs: True      (T1: routes attach to ListenerSet)
#  d) kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=hoprd-gw
#       -> ports 9000/TCP and 9000/UDP present                    (T2: ports exposed on the LB Service)
#  e) IP=<LB external IP>;  echo hi | nc -w2 $IP 9000;  echo hi | nc -u -w2 $IP 9000
#       -> both echo "hi"                                         (T3: data path works)
#  f) Add a second ListenerSet/node while pinging UDP in a loop: no packet loss (T4: no disruption).
#  g) Create 40 ListenerSets x 20 listeners (800 ports): note Envoy memory and config-update time (T5).
